services:
  db:
    image: postgres:16-alpine
    container_name: sdpp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-secure_docs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-secure_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdpp-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-secure_docs}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-real-secure-random-32-byte-secret-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173}
      STORAGE_PATH: /app/storage/encrypted
      LEDGER_STORAGE_PATH: /app/storage/ledger
      DOCUMENT_KEK_BASE64: ${DOCUMENT_KEK_BASE64:-}
      RECIPIENT_KEY_KEK_BASE64: ${RECIPIENT_KEY_KEK_BASE64:-}
      PROVENANCE_KEY_KEK_BASE64: ${PROVENANCE_KEY_KEK_BASE64:-}
      MFA_ENCRYPTION_KEY_BASE64: ${MFA_ENCRYPTION_KEY_BASE64:-}
      FORENSIC_MASTER_KEY_BASE64: ${FORENSIC_MASTER_KEY_BASE64:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - encrypted_storage:/app/storage/encrypted
      - ledger_storage:/app/storage/ledger
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - platform-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdpp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - platform-net

volumes:
  postgres_data:
    driver: local
  encrypted_storage:
    driver: local
  ledger_storage:
    driver: local

networks:
  platform-net:
    driver: bridge
